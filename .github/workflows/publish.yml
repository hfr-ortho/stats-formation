name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.37

      # The footer of every page shows this as "Last updated" (page-footer in _quarto.yml), in Zurich time.
      - name: Stamp the build time
        run: echo "SITE_UPDATED=$(TZ=Europe/Zurich date +'%d.%m.%Y, %H:%M')" >> "$GITHUB_ENV"

      # Builds from _freeze/ (no R or Python). If a page changed without its
      # freeze being refreshed, this step fails because R is not installed.
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
